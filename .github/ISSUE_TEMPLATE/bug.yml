name: Relatar um problema
description: Informe um comportamento inesperado ou uma falha reproduzível.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Obrigada por ajudar a melhorar a SouCodigo.
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
      description: Descreva o problema de forma clara.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir?
      placeholder: "1. Acesse...\n2. Clique...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que deveria acontecer?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Navegador ou ambiente
      placeholder: Chrome 128, Android 15, Node.js 22...
